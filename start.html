<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Chess Game</title>

    <link rel="stylesheet" href="point.css">
</head>

<body>

    <div class="container">

        <h1>♟️ Simple Chess</h1>

        <div class="controls">
            <button id="botMode">🤖 Play vs Bot</button>
            <button id="friendMode">👥 Play with Friend</button>
            <button id="restart">🔄 Restart</button>
        </div>

        <div class="game-area">

            <div>
                <div id="status">White's Turn</div>

                <div id="board"></div>
            </div>

            <div class="side-panel">

                <h2>Move History</h2>

                <div id="moves">
                    No moves yet
                </div>

                <div class="info">
                    <p>White: ♙</p>
                    <p>Black: ♟</p>
                </div>

            </div>

        </div>

    </div>

    <script src="me.js"></script>

</body>
</html>
